# CiberCortex IA — Docker Compose (desarrollo)
# Uso básico:  docker compose up
# Con worker:  docker compose --profile worker up
# Con nginx:   docker compose --profile nginx up
# Migrate:     docker compose --profile migrate run --rm migrate

version: '3.9'

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file: .env
  environment:
    DB_HOST: db
    DB_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:

  # ── Base de datos ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     ${DB_USER:-cybercortex}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cybercortex}
      POSTGRES_DB:       ${DB_NAME:-cybercortex}
    ports:
      - "${DB_EXPOSE_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cybercortex}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Migraciones (one-shot) ───────────────────────────────────────────────────
  migrate:
    <<: *backend-common
    command: alembic upgrade head
    restart: "no"
    profiles:
      - migrate

  # ── Seed (one-shot — crea usuario admin inicial) ─────────────────────────────
  seed:
    <<: *backend-common
    command: python scripts/seed.py
    restart: "no"
    profiles:
      - seed

  # ── API Backend ──────────────────────────────────────────────────────────────
  api:
    <<: *backend-common
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - reports_data:/tmp/cybercortex/reports
    command: >
      uvicorn app.main:app
        --host 0.0.0.0
        --port 8000
        --reload
        --log-level info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Celery Worker ────────────────────────────────────────────────────────────
  worker:
    <<: *backend-common
    volumes:
      - ./backend:/app
      - reports_data:/tmp/cybercortex/reports
    command: >
      celery -A app.services.task_manager worker
        --loglevel=info
        --concurrency=4
        -Q scans,reports,default
    profiles:
      - worker

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    environment:
      NODE_ENV: production
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  # ── Nginx reverse proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - api
      - frontend
    restart: unless-stopped
    profiles:
      - nginx

volumes:
  postgres_data:
  redis_data:
  reports_data:
  nginx_logs:
