name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:

  # ── Backend: lint ────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend · Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install lint dependencies
        run: pip install ruff bandit

      - name: Ruff lint
        run: ruff check app/ tests/

      - name: Ruff format check
        run: ruff format --check app/ tests/

      - name: Bandit security scan
        run: bandit -c pyproject.toml -r app/ -q


  # ── Backend: tests ───────────────────────────────────────────────────────────
  backend-tests:
    name: Backend · Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: backend-lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    defaults:
      run:
        working-directory: backend

    env:
      # Valores mínimos para tests (SQLite in-memory, sin servicios externos)
      SECRET_KEY: ci-test-secret-key-at-least-32-characters-long
      ENVIRONMENT: test
      ANTHROPIC_API_KEY: sk-ant-test-key-not-real
      DB_USER: cybercortex
      DB_PASSWORD: cybercortex
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: cybercortex

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false


  # ── Frontend: lint + typecheck ───────────────────────────────────────────────
  frontend-lint:
    name: Frontend · Lint & TypeCheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Next.js lint
        run: npm run lint

      - name: TypeScript typecheck
        run: npx tsc --noEmit


  # ── Frontend: build ──────────────────────────────────────────────────────────
  frontend-build:
    name: Frontend · Build
    runs-on: ubuntu-latest
    needs: frontend-lint
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_TELEMETRY_DISABLED: "1"


  # ── Docker: build images ─────────────────────────────────────────────────────
  docker-build:
    name: Docker · Build images
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: cibercortex-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: cibercortex-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_API_URL=
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # ── Resumen de CI ─────────────────────────────────────────────────────────────
  ci-summary:
    name: CI · Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-build, docker-build]
    if: always()

    steps:
      - name: Check all jobs
        run: |
          echo "backend-tests: ${{ needs.backend-tests.result }}"
          echo "frontend-build: ${{ needs.frontend-build.result }}"
          echo "docker-build: ${{ needs.docker-build.result }}"
          if [[ "${{ needs.backend-tests.result }}" != "success" || \
                "${{ needs.frontend-build.result }}" != "success" ]]; then
            echo "❌ CI fallido"
            exit 1
          fi
          echo "✅ CI pasado"
